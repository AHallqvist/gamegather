{% extends "base.html" %}
{% block title %}Create a game · GameGather{% endblock %}
{% block content %}
  <section class="form-panel">
    <p class="eyebrow">Organize a game</p>
    <h1>Create a game</h1>
    <p class="muted">We’ll send a confirmation to your notification address and provide a private organizer link.</p>

    <form action="/games/new" method="post" class="stack">
      <label>Game title
        <input name="title" required maxlength="120" placeholder="Blood on the Clocktower">
      </label>
      <label>Minimum players
        <input name="min_players" type="number" min="1" required>
      </label>
      <label>Your name
        <input name="organizer_name" required maxlength="100">
      </label>
      <label>Notification method
        <select name="notification_method" required>
          <option value="email">Email</option>
        </select>
      </label>
      <label>Email address
        <input name="notification_target" type="email" required autocomplete="email">
      </label>
      <button type="submit">Create game</button>
    </form>
  </section>
{% endblock %}
