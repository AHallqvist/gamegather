services:
  app:
    build:
      context: ./app
    container_name: gamegather-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-true}
      DISCORD_ENABLED: ${DISCORD_ENABLED:-false}
      SMS_ENABLED: ${SMS_ENABLED:-false}
    volumes:
      - sqlite_data:/data
    ports:
      - "3000:3000"

volumes:
  sqlite_data:
